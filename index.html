<!DOCTYPE html>
<html>
<head>
  <base href="/gymzo-admin/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gymzo Admin Panel">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Gymzo Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Gymzo Admin</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #ffffff;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #ffffff;
      z-index: 9999;
      transition: opacity 0.4s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }
    #loading img {
      width: 96px;
      height: 96px;
      border-radius: 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e5e5e5;
      border-top-color: #333333;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .loading-text {
      color: #666666;
      font-size: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<div id="loading">
  <img src="icons/Icon-192.png" alt="Gymzo">
  <div class="spinner"></div>
  <div class="loading-text">Loading Gymzo Admin...</div>
</div>

<script>
  function hideLoading() {
    var el = document.getElementById('loading');
    if (!el) return;
    el.classList.add('hide');
    setTimeout(function () { el.remove(); }, 500);
  }
  // Fired by Flutter when the first frame is rendered
  window.addEventListener('flutter-first-frame', hideLoading);
  document.addEventListener('flutter-first-frame', hideLoading);
</script>

<script src="flutter_bootstrap.js" async></script>
</body>
</html>
